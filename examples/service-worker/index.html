<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SyncKit Service Worker Example</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 2rem;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    h1 {
      color: #667eea;
      margin-bottom: 1rem;
    }

    .status {
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status.online {
      background: #d1fae5;
      color: #065f46;
    }

    .status.offline {
      background: #fee2e2;
      color: #991b1b;
    }

    .indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: currentColor;
    }

    .form {
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      color: #374151;
    }

    input, select {
      width: 100%;
      padding: 0.75rem;
      border: 2px solid #e5e7eb;
      border-radius: 6px;
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      background: #667eea;
      color: white;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #5568d3;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .queue {
      margin-top: 2rem;
    }

    .queue h2 {
      color: #374151;
      margin-bottom: 1rem;
      font-size: 1.25rem;
    }

    .queue-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .stat {
      background: #f9fafb;
      padding: 1rem;
      border-radius: 8px;
      text-align: center;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: bold;
      color: #667eea;
    }

    .stat-label {
      color: #6b7280;
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }

    .operation {
      background: #f9fafb;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 0.75rem;
      border-left: 4px solid #667eea;
    }

    .operation.pending {
      border-left-color: #fbbf24;
    }

    .operation.syncing {
      border-left-color: #3b82f6;
    }

    .operation.success {
      border-left-color: #10b981;
    }

    .operation.failed {
      border-left-color: #ef4444;
    }

    .operation-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .operation-method {
      font-weight: 600;
      color: #374151;
    }

    .operation-status {
      padding: 0.25rem 0.75rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
    }

    .operation-status.pending {
      background: #fef3c7;
      color: #92400e;
    }

    .operation-status.syncing {
      background: #dbeafe;
      color: #1e40af;
    }

    .operation-status.success {
      background: #d1fae5;
      color: #065f46;
    }

    .operation-status.failed {
      background: #fee2e2;
      color: #991b1b;
    }

    .operation-details {
      color: #6b7280;
      font-size: 0.875rem;
    }

    code {
      background: #f3f4f6;
      padding: 0.125rem 0.25rem;
      border-radius: 3px;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔄 SyncKit Service Worker Example</h1>

    <div class="status" id="status">
      <div class="indicator"></div>
      <span id="status-text">Initializing...</span>
    </div>

    <div class="form">
      <h2>Create Todo Item</h2>
      <form id="todo-form">
        <div class="form-group">
          <label for="title">Title</label>
          <input type="text" id="title" placeholder="Buy groceries" required>
        </div>

        <div class="form-group">
          <label for="priority">Priority</label>
          <select id="priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>

        <button type="submit">Add Todo (Will Sync in Background)</button>
      </form>
    </div>

    <div class="queue">
      <h2>Sync Queue</h2>

      <div class="queue-stats">
        <div class="stat">
          <div class="stat-value" id="stat-pending">0</div>
          <div class="stat-label">Pending</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="stat-syncing">0</div>
          <div class="stat-label">Syncing</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="stat-failed">0</div>
          <div class="stat-label">Failed</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="stat-total">0</div>
          <div class="stat-label">Total</div>
        </div>
      </div>

      <div id="operations-list"></div>
    </div>
  </div>

  <script type="module">
    // NOTE: In a real application, you would import from your bundled code
    // For this example, we'll use CDN links

    console.log('Loading SyncKit example...')

    // This is a simplified example - in production you would use proper imports
    // import { createSyncKit } from '@oxog/synckit'
    // import { registerServiceWorker, backgroundSyncPlugin } from '@oxog/synckit/sw'

    // For now, we'll just show the UI without actual SyncKit integration
    // Users should replace this with actual imports in their applications

    // Update online/offline status
    function updateStatus() {
      const status = document.getElementById('status')
      const statusText = document.getElementById('status-text')

      if (navigator.onLine) {
        status.className = 'status online'
        statusText.textContent = 'Online - Operations will sync automatically'
      } else {
        status.className = 'status offline'
        statusText.textContent = 'Offline - Operations will sync when connection is restored'
      }
    }

    window.addEventListener('online', updateStatus)
    window.addEventListener('offline', updateStatus)
    updateStatus()

    // Handle form submission
    document.getElementById('todo-form').addEventListener('submit', (e) => {
      e.preventDefault()

      const title = document.getElementById('title').value
      const priority = document.getElementById('priority').value

      // In a real app, you would do:
      // sync.push({
      //   resource: 'todos',
      //   method: 'POST',
      //   payload: { title, priority }
      // })

      console.log('Would sync:', { title, priority })
      document.getElementById('title').value = ''

      alert('In a real application, this would queue the operation for background sync!')
    })

    console.log('SyncKit example loaded. Check README.md for integration instructions.')
  </script>
</body>
</html>
